name: Garmin-synk

# Daglig henting av Garmin-dagssammendrag → Supabase. Kan også kjøres manuelt
# (med valgfritt antall dager for backfill) via «Run workflow» i Actions-fanen.
on:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC daglig (~07:30 norsk tid) – etter nattens synk
  workflow_dispatch:
    inputs:
      dager:
        description: 'Antall dager bakover å hente (backfill, f.eks. 90)'
        required: false
        default: '3'

# Unngå overlappende kjøringer.
concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  synk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r garmin_sync/requirements.txt
      # Secrets leses som env-variabler (aldri interpolert inn i skriptet – de
      # inneholder JSON/hermetegn som ville brutt shell-syntaksen).
      - name: Sjekk at secrets finnes
        shell: bash
        run: |
          mangler=""
          [ -n "$GARMIN_TOKENS" ] || mangler="$mangler GARMIN_TOKENS"
          [ -n "$SUPABASE_URL" ] || mangler="$mangler SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || mangler="$mangler SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$HT_USER_ID" ] || mangler="$mangler HT_USER_ID"
          # Kun LENGDER (aldri innhold) – avdekker avkuttet innliming.
          {
            echo "### Secrets"
            echo "| Secret | Lengde | Forventet |"
            echo "|---|---|---|"
            echo "| GARMIN_TOKENS | ${#GARMIN_TOKENS} | ~2000+ |"
            echo "| SUPABASE_URL | ${#SUPABASE_URL} | ~40 |"
            echo "| SUPABASE_SERVICE_ROLE_KEY | ${#SUPABASE_SERVICE_ROLE_KEY} | 40+ |"
            echo "| HT_USER_ID | ${#HT_USER_ID} | 36 |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$mangler" ]; then
            echo "::error::Mangler secrets:$mangler"
            echo "### ❌ Mangler secrets:$mangler" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HT_USER_ID: ${{ secrets.HT_USER_ID }}

      - name: Kjør synk
        shell: bash
        run: |
          set -o pipefail
          python garmin_sync/sync.py 2>&1 | tee synk.log
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HT_USER_ID: ${{ secrets.HT_USER_ID }}
          DAGER: ${{ github.event.inputs.dager || '3' }}

      # Vis resultatet (også ved feil) rett på Summary-siden, så man ikke må
      # grave i loggen for å se hva som gikk galt.
      - name: Oppsummering
        if: always()
        shell: bash
        run: |
          {
            echo "### Garmin-synk"
            echo '```'
            tail -n 25 synk.log 2>/dev/null || echo "(ingen utskrift - synken startet ikke)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
